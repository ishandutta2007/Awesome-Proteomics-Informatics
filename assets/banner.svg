<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Awesome Proteomics Informatics — curated list of open-source and commercial proteomics software for mass spectrometry data analysis">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#312e81;#0f172a" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#312e81;#4338ca;#1e1b4b" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#312e81">
        <animate attributeName="stop-color" values="#312e81;#0f172a;#1e1b4b;#312e81" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#e879f9;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9;#22d3ee;#818cf8;#e879f9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Animated background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Floating blurred orbs (dynamic) -->
  <circle cx="150" cy="80" r="120" fill="url(#glow)" filter="url(#blur1)">
    <animate attributeName="cx" values="120;240;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;140;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="240" r="150" fill="url(#glow)" filter="url(#blur1)">
    <animate attributeName="cx" values="980;1100;980" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="260;180;260" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="300" r="100" fill="url(#glow)" filter="url(#blur1)">
    <animate attributeName="r" values="80;140;80" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated amino-acid chain / beads motif -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 60 250 Q 140 210 220 250 T 380 250 T 540 250">
      <animate attributeName="d" values="M 60 250 Q 140 210 220 250 T 380 250 T 540 250;M 60 250 Q 140 290 220 250 T 380 250 T 540 250;M 60 250 Q 140 210 220 250 T 380 250 T 540 250" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
    <circle cx="60" cy="250" r="7" fill="#22d3ee">
      <animate attributeName="cy" values="250;250;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="250" r="7" fill="#818cf8">
      <animate attributeName="cy" values="250;250;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="250" r="7" fill="#e879f9">
      <animate attributeName="cy" values="250;250;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="250" r="7" fill="#f472b6">
      <animate attributeName="cy" values="250;250;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mirror chain on the right -->
  <g transform="translate(660 0)">
    <g stroke="#e879f9" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 0 60 Q 80 100 160 60 T 320 60">
        <animate attributeName="d" values="M 0 60 Q 80 100 160 60 T 320 60;M 0 60 Q 80 20 160 60 T 320 60;M 0 60 Q 80 100 160 60 T 320 60" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g>
      <circle cx="0" cy="60" r="7" fill="#e879f9">
        <animate attributeName="cy" values="60;60;60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="7;9;7" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="60" r="7" fill="#22d3ee">
        <animate attributeName="cy" values="60;60;60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="7;9;7" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="60" r="7" fill="#818cf8">
        <animate attributeName="cy" values="60;60;60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="7;9;7" dur="2s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Floating particles (dynamic) -->
  <g fill="#a5b4fc">
    <circle cx="100" cy="40" r="2.5" opacity="0.8">
      <animate attributeName="cy" values="320;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="40" r="2" opacity="0.6">
      <animate attributeName="cy" values="320;0" dur="13s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="3" opacity="0.7">
      <animate attributeName="cy" values="320;0" dur="11s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="40" r="2" opacity="0.5">
      <animate attributeName="cy" values="320;0" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="40" r="2.5" opacity="0.6">
      <animate attributeName="cy" values="320;0" dur="12s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)" filter="url(#dropShadow)">
    <tspan>🧬 Awesome-Proteomics-Informatics</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="url(#subGrad)">
    <tspan>Curated tools for mass-spectrometry proteomics · DDA · DIA · PTM · de novo · quantification</tspan>
  </text>

  <!-- Pulsing accent line under title -->
  <rect x="360" y="168" width="480" height="3" rx="1.5" fill="#22d3ee">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="300;480;300" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;360;450" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Twinkling stars (top-right) -->
  <g fill="#ffffff">
    <circle cx="80" cy="30" r="1.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="110" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="180" r="1.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="60" r="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
